<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>EXTRAPLAST | Almoxarifado V2.1</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#f4f6f8;color:#17202a}*{box-sizing:border-box}.hide{display:none!important}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center}.box,.card{background:#fff;border:1px solid #e4e7ec;border-radius:10px;padding:20px}.box{width:400px}.field{margin:12px 0}.field label{display:block;font-weight:700;font-size:12px;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;padding:9px;border:1px solid #d0d5dd;border-radius:7px}
button{border:0;border-radius:7px;padding:9px 12px;font-weight:700;cursor:pointer}.primary{background:#155eef;color:#fff}.light{background:#eef2f6}.badmsg{background:#fee4e2;color:#b42318;padding:9px;border-radius:7px;font-size:12px}
header{height:64px;background:#102a43;color:#fff;display:flex;justify-content:space-between;align-items:center;padding:0 22px}.wrap{display:flex;min-height:calc(100vh - 64px)}
nav{width:225px;background:#fff;padding:14px 10px;border-right:1px solid #e4e7ec}nav button{width:100%;background:transparent;text-align:left;margin:2px 0;color:#344054}nav button.active,nav button:hover{background:#eef4ff;color:#155eef}
main{flex:1;padding:22px;overflow:auto}.head{display:flex;justify-content:space-between;align-items:center}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:14px 0}.kpi b{display:block;font-size:26px;margin-top:7px}.kpi span{font-size:12px;color:#667085}
table{width:100%;border-collapse:collapse;background:#fff}th,td{padding:9px;border-bottom:1px solid #e4e7ec;text-align:left;font-size:12px;white-space:nowrap}th{background:#f8fafc}.scroll{overflow:auto;border:1px solid #e4e7ec;border-radius:8px}
.badge{padding:4px 7px;border-radius:99px;font-size:11px;font-weight:700}.ok{background:#d1fadf;color:#027a48}.warn{background:#fef0c7;color:#b54708}.bad{background:#fee4e2;color:#b42318}.high{background:#e0eaff;color:#175cd3}
.form{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.actions{text-align:right;margin-top:12px}.toolbar{margin:10px 0}.toolbar input{padding:9px;border:1px solid #d0d5dd;border-radius:7px;min-width:280px}
.modal{position:fixed;inset:0;background:#10182888;display:flex;align-items:center;justify-content:center;padding:20px}.modal .box{width:760px;max-width:100%;max-height:90vh;overflow:auto}
@media(max-width:800px){.grid,.form{grid-template-columns:1fr 1fr}}@media(max-width:600px){.wrap{display:block}nav{width:100%;display:flex;overflow:auto}nav button{min-width:130px}.grid,.form{grid-template-columns:1fr}}
</style></head><body>
<div id="login" class="login"><div class="box"><h1>EXTRAPLAST</h1><p>Sistema de Almoxarifado V2</p><div id="msg"></div><div class="field"><label>E-mail</label><input id="email" type="email"></div><div class="field"><label>Senha</label><input id="senha" type="password"></div><button id="entrar" class="primary" style="width:100%">Entrar</button></div></div>
<div id="app" class="hide"><header><b>EXTRAPLAST · Almoxarifado V2.1</b><div><span id="user"></span> <button id="sair" class="light">Sair</button></div></header><div class="wrap"><nav>
<button data-p="dash" class="active">📊 Dashboard</button><button data-p="itens">📦 Itens</button><button data-p="entrada">➕ Entrada</button><button data-p="saida">➖ Consumo / Saída</button><button data-p="estoque">📋 Estoque</button><button data-p="historico">🧾 Histórico</button>
</nav><main><section id="dash"></section><section id="itens" class="hide"></section><section id="entrada" class="hide"></section><section id="saida" class="hide"></section><section id="estoque" class="hide"></section><section id="historico" class="hide"></section></main></div></div>
<div id="modal" class="modal hide"><div class="box"><div class="head"><h2 id="mt"></h2><button onclick="closeModal()">×</button></div><div id="mb"></div></div></div>
<script>
const db=supabase.createClient("https://wkfeikbybhcuvsexxrjx.supabase.co","sb_publishable_xy0w23lFJIywjFw0a9Msvg_w17LcZoI");
let S={u:null,p:null,i:[],m:[],c:[],f:[]};const $=x=>document.getElementById(x);
const esc=x=>String(x??"").replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const qty=x=>Number(x||0).toLocaleString("pt-BR",{maximumFractionDigits:3}),money=x=>Number(x||0).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const saldo=id=>S.m.filter(x=>x.item_id===id).reduce((a,x)=>a+(x.tipo==="entrada"?+x.quantidade:-x.quantidade),0);
function status(i){let s=saldo(i.id),mi=+i.estoque_minimo||0,ma=+i.estoque_maximo||0;if(s<=0)return["Sem estoque","bad"];if(mi&&s<mi)return["Abaixo mínimo","warn"];if(ma&&s>ma)return["Acima máximo","high"];return["Normal","ok"]}
const edit=()=>S.p?.perfil!=="consulta";
async function load(){let r=await Promise.all([db.from("itens").select("*,categorias(nome),fornecedores(nome)").eq("ativo",true).order("descricao"),db.from("categorias").select("*").eq("ativo",true).order("nome"),db.from("fornecedores").select("*").eq("ativo",true).order("nome"),db.from("movimentacoes").select("*,itens(codigo,descricao),fornecedores(nome)").order("data_movimentacao",{ascending:false}).order("id",{ascending:false})]);for(let x of r)if(x.error)throw x.error;[S.i,S.c,S.f,S.m]=r.map(x=>x.data||[])}
async function start(u){S.u=u;let {data,error}=await db.from("perfis").select("*").eq("id",u.id).maybeSingle();if(error||!data){$("msg").innerHTML='<div class="badmsg">Login válido, mas não existe perfil correspondente na tabela perfis.</div>';await db.auth.signOut();return}S.p=data;try{await load()}catch(e){$("msg").innerHTML='<div class="badmsg">'+esc(e.message)+'</div>';return}$("login").classList.add("hide");$("app").classList.remove("hide");$("user").textContent=(data.nome||u.email)+" · "+data.perfil;page("dash")}
async function login(){let {data,error}=await db.auth.signInWithPassword({email:$("email").value.trim(),password:$("senha").value});if(error){$("msg").innerHTML='<div class="badmsg">'+esc(error.message)+'</div>';return}await start(data.user)}
function page(p){document.querySelectorAll("main section").forEach(x=>x.classList.add("hide"));$(p).classList.remove("hide");document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("active",x.dataset.p===p));({dash, itens, entrada:()=>movForm("entrada"),saida:()=>movForm("saida"),estoque,historico}[p])()}
function dash(){let val=S.i.reduce((a,i)=>a+saldo(i.id)*(+i.custo_unitario||0),0),att=S.i.filter(i=>status(i)[1]!=="ok");$("dash").innerHTML=`<div class="head"><div><h1>Dashboard</h1><p>Visão geral do almoxarifado</p></div><button class="primary" onclick="load().then(dash)">Atualizar</button></div><div class="grid"><div class="card kpi"><span>Itens ativos</span><b>${S.i.length}</b></div><div class="card kpi"><span>Valor em estoque</span><b>${money(val)}</b></div><div class="card kpi"><span>Itens em atenção</span><b>${att.length}</b></div><div class="card kpi"><span>Movimentações</span><b>${S.m.length}</b></div></div>${tableItems(att.slice(0,10),"Itens em atenção")}`}
function tableItems(a,title="Itens"){return`<div class="card"><h3>${title}</h3><div class="scroll"><table><tr><th>Código</th><th>Descrição</th><th>Saldo</th><th>Mín.</th><th>Máx.</th><th>Status</th></tr>${a.map(i=>{let s=status(i);return`<tr><td>${esc(i.codigo)}</td><td>${esc(i.descricao)}</td><td>${qty(saldo(i.id))} ${esc(i.unidade)}</td><td>${qty(i.estoque_minimo)}</td><td>${qty(i.estoque_maximo)}</td><td><span class="badge ${s[1]}">${s[0]}</span></td></tr>`}).join("")}</table></div></div>`}
function itens(){$("itens").innerHTML=`<div class="head"><div><h1>Cadastro de Itens</h1><p>Materiais, peças, EPIs e insumos</p></div>${edit()?'<button class="primary" onclick="itemModal()">+ Novo item</button>':""}</div><div class="toolbar"><input id="search" placeholder="Pesquisar código ou descrição..." oninput="filterItems()"></div><div id="ilist"></div>`;filterItems()}
function filterItems(){let q=($("search")?.value||"").toLowerCase(),a=S.i.filter(i=>(`${i.codigo} ${i.descricao}`).toLowerCase().includes(q));$("ilist").innerHTML=`<div class="scroll"><table><tr><th>Código</th><th>Descrição</th><th>Categoria</th><th>Un.</th><th>Saldo</th><th>Local</th><th>Custo</th><th>Status</th><th></th></tr>${a.map(i=>{let s=status(i);return`<tr><td>${esc(i.codigo)}</td><td>${esc(i.descricao)}</td><td>${esc(i.categorias?.nome)}</td><td>${esc(i.unidade)}</td><td>${qty(saldo(i.id))}</td><td>${esc(i.localizacao)}</td><td>${money(i.custo_unitario)}</td><td><span class="badge ${s[1]}">${s[0]}</span></td><td>${edit()?`<button onclick="itemModal(${i.id})">Editar</button>`:""}</td></tr>`}).join("")}</table></div>`}
function itemModal(id){let i=id?S.i.find(x=>x.id===id):{};$("mt").textContent=id?"Editar item":"Novo item";$("mb").innerHTML=`<div class="form"><div class="field"><label>Código *</label><input id="fc" value="${esc(i.codigo)}"></div><div class="field"><label>Descrição *</label><input id="fd" value="${esc(i.descricao)}"></div><div class="field"><label>Unidade *</label><input id="fu" value="${esc(i.unidade||"UN")}"></div><div class="field"><label>Categoria</label><select id="fcat"><option value="">Selecione</option>${S.c.map(c=>`<option value="${c.id}" ${i.categoria_id==c.id?"selected":""}>${esc(c.nome)}</option>`).join("")}</select></div><div class="field"><label>Mínimo</label><input id="fmin" type="number" step=".001" value="${i.estoque_minimo||0}"></div><div class="field"><label>Máximo</label><input id="fmax" type="number" step=".001" value="${i.estoque_maximo||0}"></div><div class="field"><label>Localização</label><input id="fl" value="${esc(i.localizacao)}"></div><div class="field"><label>Custo unitário</label><input id="fcu" type="number" step=".0001" value="${i.custo_unitario||0}"></div><div class="field"><label>Fornecedor</label><select id="ff"><option value="">Selecione</option>${S.f.map(f=>`<option value="${f.id}" ${i.fornecedor_id==f.id?"selected":""}>${esc(f.nome)}</option>`).join("")}</select></div></div><div class="actions"><button onclick="closeModal()">Cancelar</button> <button class="primary" onclick="saveItem(${id||"null"})">Salvar</button></div>`;$("modal").classList.remove("hide")}
async function saveItem(id){let p={codigo:$("fc").value.trim(),descricao:$("fd").value.trim(),unidade:$("fu").value.trim()||"UN",categoria_id:$("fcat").value?+$("fcat").value:null,estoque_minimo:+$("fmin").value||0,estoque_maximo:+$("fmax").value||0,localizacao:$("fl").value.trim()||null,custo_unitario:+$("fcu").value||0,fornecedor_id:$("ff").value?+$("ff").value:null};if(!p.codigo||!p.descricao)return alert("Código e descrição são obrigatórios.");let r=id?await db.from("itens").update(p).eq("id",id):await db.from("itens").insert(p);if(r.error)return alert(r.error.message);closeModal();await load();itens()}
function movForm(tipo){let e=tipo==="entrada";$(tipo).innerHTML=`<div class="head"><div><h1>${e?"Entrada de Materiais":"Consumo / Saída"}</h1><p>${e?"Recebimentos e compras":"Baixa por setor e centro de custo"}</p></div></div><div class="card"><div class="form"><div class="field"><label>Item *</label><select id="mi" onchange="previewMov('${tipo}')"><option value="">Selecione</option>${S.i.map(i=>`<option value="${esc(i.id)}">${esc(i.codigo)} — ${esc(i.descricao)} | saldo ${qty(saldo(i.id))}</option>`).join("")}</select></div><div class="field"><label>Quantidade *</label><input id="mq" type="number" min="0.001" step=".001" oninput="previewMov('${tipo}')"></div><div class="field"><label>Data *</label><input id="md" type="date" value="${new Date().toISOString().slice(0,10)}"></div>${e?`<div class="field"><label>Nota fiscal</label><input id="mnf"></div><div class="field"><label>Fornecedor</label><select id="mf"><option value="">Selecione</option>${S.f.map(f=>`<option value="${f.id}">${esc(f.nome)}</option>`).join("")}</select></div><div class="field"><label>Custo unitário</label><input id="mc" type="number" step=".0001"></div>`:`<div class="field"><label>Setor</label><input id="ms"></div><div class="field"><label>Centro de custo</label><input id="mcc"></div><div class="field"><label>Motivo</label><input id="mm"></div>`}</div><div id="movPreview" style="margin-top:12px;padding:10px;border-radius:7px;background:#f8fafc;color:#475467;font-size:13px">Selecione o item e informe a quantidade.</div><div class="actions"><button class="primary" ${edit()?"":"disabled"} onclick="saveMov('${tipo}')">Registrar ${e?"entrada":"saída"}</button></div></div>`}
function getMovItem(){let el=$("mi");if(!el||!el.value)return null;return S.i.find(x=>String(x.id)===String(el.value))||null}
function previewMov(tipo){let i=getMovItem(),n=parseFloat($("mq")?.value||"0"),box=$("movPreview");if(!box)return;if(!i){box.textContent="Selecione um item.";return}let atual=saldo(i.id),depois=tipo==="entrada"?atual+(n||0):atual-(n||0);box.innerHTML=`Saldo atual: <b>${qty(atual)} ${esc(i.unidade)}</b> &nbsp;→&nbsp; Saldo após ${tipo==="entrada"?"entrada":"saída"}: <b>${qty(depois)} ${esc(i.unidade)}</b>`;box.style.background=(tipo==="saida"&&n>atual)?"#fee4e2":"#f8fafc"}
async function saveMov(tipo){let el=$("mi"),qel=$("mq"),del=$("md");let rawId=el?el.value:"",n=qel?parseFloat(qel.value):NaN;if(!rawId){alert("Selecione um item.");return}if(!Number.isFinite(n)||n<=0){alert("Informe uma quantidade válida maior que zero.");return}let i=getMovItem();if(!i){alert("Não foi possível localizar o item selecionado. Atualize a página e tente novamente.");return}let atual=saldo(i.id);if(tipo==="saida"&&n>atual){alert("Estoque insuficiente. Saldo atual: "+qty(atual)+" "+(i.unidade||""));return}if(!del||!del.value){alert("Informe a data da movimentação.");return}let p={item_id:i.id,tipo,quantidade:n,data_movimentacao:del.value,usuario_id:S.u.id,custo_unitario:tipo==="entrada"?(parseFloat($("mc")?.value||"0")||0):(+i.custo_unitario||0)};if(tipo==="entrada"){p.nota_fiscal=$("mnf")?.value.trim()||null;let fv=$("mf")?.value||"";p.fornecedor_id=fv?Number(fv):null}else{p.setor=$("ms")?.value.trim()||null;p.centro_custo=$("mcc")?.value.trim()||null;p.motivo=$("mm")?.value.trim()||null}let r=await db.from("movimentacoes").insert(p);if(r.error){alert("Erro ao registrar movimentação: "+r.error.message);return}if(tipo==="entrada"&&p.custo_unitario>0)await db.from("itens").update({custo_unitario:p.custo_unitario}).eq("id",i.id);await load();movForm(tipo);alert((tipo==="entrada"?"Entrada":"Saída")+" registrada com sucesso.")}
function estoque(){$("estoque").innerHTML=`<div class="head"><div><h1>Estoque Atual</h1><p>Saldo calculado pelas movimentações</p></div></div>${tableItems(S.i,"Posição de estoque")}`}
function historico(){$("historico").innerHTML=`<div class="head"><div><h1>Histórico</h1><p>Entradas e saídas registradas</p></div></div><div class="scroll"><table><tr><th>Data</th><th>Tipo</th><th>Código</th><th>Item</th><th>Qtd.</th><th>NF</th><th>Setor</th><th>Centro de custo</th><th>Motivo</th></tr>${S.m.map(m=>`<tr><td>${new Date(m.data_movimentacao).toLocaleString("pt-BR")}</td><td>${m.tipo}</td><td>${esc(m.itens?.codigo)}</td><td>${esc(m.itens?.descricao)}</td><td>${qty(m.quantidade)}</td><td>${esc(m.nota_fiscal)}</td><td>${esc(m.setor)}</td><td>${esc(m.centro_custo)}</td><td>${esc(m.motivo)}</td></tr>`).join("")}</table></div>`}
function closeModal(){$("modal").classList.add("hide")}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>page(b.dataset.p));$("entrar").onclick=login;$("senha").onkeydown=e=>{if(e.key==="Enter")login()};$("sair").onclick=async()=>{await db.auth.signOut();location.reload()};
(async()=>{let {data:{session}}=await db.auth.getSession();if(session)await start(session.user)})();
</script></body></html>
