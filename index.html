<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EXTRAPLAST · Almoxarifado V3 - Acesso Livre</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--b:#0f3d62;--b2:#185b8d;--bg:#f3f6f9;--card:#fff;--txt:#1f2937;--mut:#6b7280;--ok:#16803c;--warn:#b7791f;--bad:#c53030;--line:#dce3ea}
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--txt)}
header{background:var(--b);color:#fff;padding:16px 22px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
header h1{font-size:20px;margin:0}.small{font-size:12px;color:var(--mut)}header .small{color:#dce8f2}
button,.btn{border:0;border-radius:7px;padding:9px 13px;cursor:pointer;font-weight:600;background:var(--b2);color:#fff}
button.secondary{background:#64748b}button.danger{background:#b91c1c}button:disabled{opacity:.5;cursor:not-allowed}
nav{background:#fff;border-bottom:1px solid var(--line);padding:10px 18px;display:flex;gap:8px;flex-wrap:wrap}
nav button{background:#e8eef4;color:#223}nav button.active{background:var(--b);color:#fff}
main{max-width:1250px;margin:18px auto;padding:0 14px}.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:14px;box-shadow:0 2px 8px #0000000a}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.kpi{font-size:27px;font-weight:700;color:var(--b)}
label{font-size:13px;font-weight:700;display:block;margin-bottom:5px}input,select,textarea{width:100%;padding:9px;border:1px solid #cbd5e1;border-radius:6px;background:#fff}textarea{min-height:70px}
.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}.span2{grid-column:span 2}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:9px;border-bottom:1px solid #e5e7eb;text-align:left}th{background:#f8fafc}
.tablewrap{overflow:auto}.badge{display:inline-block;padding:4px 8px;border-radius:999px;font-size:11px;font-weight:700}.ok{background:#dcfce7;color:#166534}.warn{background:#fef3c7;color:#92400e}.bad{background:#fee2e2;color:#991b1b}
.msg{padding:10px;border-radius:6px;margin-top:10px;display:none}.msg.show{display:block}.msg.okm{background:#dcfce7;color:#166534}.msg.err{background:#fee2e2;color:#991b1b}
.login{max-width:420px;margin:80px auto}.actions{display:flex;gap:7px;flex-wrap:wrap}.muted{color:var(--mut)}h2{margin-top:0;font-size:20px}h3{font-size:16px}
.tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}.tabs button{background:#e5e7eb;color:#111827}.tabs button.active{background:var(--b2);color:#fff}
@media(max-width:650px){.span2{grid-column:span 1}th,td{white-space:nowrap}}
</style>
</head>
<body>
<div id="app">

<header>
<div><h1>EXTRAPLAST · Almoxarifado V3 · Acesso Livre</h1><div class="small">Controle de estoque e consumo</div></div>
<div><span>Acesso livre</span></div>
</header>
<nav id="nav"></nav>
<main id="content"></main>
</div>

<script>
const SUPABASE_URL="https://wkfeikbybhcuvsexxrjx.supabase.co";
const SUPABASE_KEY="sb_publishable_xy0w23lFJIywjFw0a9Msvg_w17LcZoI";
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const S={user:null,perfil:null,i:[],m:[],c:[],f:[],s:[],cc:[],page:"dashboard"};
const $=id=>document.getElementById(id);
const esc=v=>String(v??"").replace(/[&<>"']/g,a=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[a]));
const num=v=>Number(String(v??"").trim().replace(",", "."))||0;
const qty=v=>num(v).toLocaleString("pt-BR",{maximumFractionDigits:3});
const money=v=>num(v).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});
const dateBR=v=>v?new Date(v+"T12:00:00").toLocaleDateString("pt-BR"):"";
const today=()=>new Date().toISOString().slice(0,10);
const canEdit=()=>true;
const saldo=id=>S.m.filter(x=>Number(x.item_id)===Number(id)).reduce((a,x)=>a+(x.tipo==="entrada"?num(x.quantidade):-num(x.quantidade)),0);
function showMsg(id,text,ok=false){let e=$(id);if(!e)return;e.textContent=text;e.className="msg show "+(ok?"okm":"err")}
function statusItem(i){let s=saldo(i.id);if(s<num(i.estoque_minimo))return ["BAIXO","bad"];if(num(i.estoque_maximo)>0&&s>num(i.estoque_maximo))return ["ACIMA MÁX.","warn"];return ["NORMAL","ok"]}
function itemName(id){let i=S.i.find(x=>Number(x.id)===Number(id));return i?`${i.codigo} — ${i.descricao}`:""}
function catName(id){return S.c.find(x=>Number(x.id)===Number(id))?.nome||""}
function fornName(id){return S.f.find(x=>Number(x.id)===Number(id))?.nome||""}

async function init(){
 S.user=null;
 S.perfil={nome:"Acesso livre",perfil:"administrador"};
 await load();renderNav();page("dashboard");
}
async function load(){
 const [i,m,c,f,s,cc]=await Promise.all([
  db.from("itens").select("*").order("codigo"),
  db.from("movimentacoes").select("*").order("data_movimentacao",{ascending:false}).order("created_at",{ascending:false}),
  db.from("categorias").select("*").order("nome"),
  db.from("fornecedores").select("*").order("nome"),
  db.from("setores").select("*").order("nome"),
  db.from("centros_custo").select("*").order("nome")
 ]);
 S.i=i.data||[];S.m=m.data||[];S.c=c.data||[];S.f=f.data||[];S.s=s.data||[];S.cc=cc.data||[];
}
function renderNav(){
 let n=[["dashboard","Dashboard"],["itens","Itens"],["entrada","Entrada"],["saida","Consumo / Saída"],["estoque","Estoque"],["historico","Histórico"],["cadastros","Cadastros"]];
 $("nav").innerHTML=n.map(x=>`<button id="nav-${x[0]}" onclick="page('${x[0]}')">${x[1]}</button>`).join("");
}
function page(p){
 S.page=p;document.querySelectorAll("nav button").forEach(b=>b.classList.remove("active"));$("nav-"+p)?.classList.add("active");
 ({dashboard, itens, entrada:()=>movForm("entrada"), saida:()=>movForm("saida"), estoque, historico, cadastros}[p]||dashboard)();
}
function dashboard(){
 let ativos=S.i.filter(x=>x.ativo!==false), baixos=ativos.filter(x=>saldo(x.id)<num(x.estoque_minimo)), valor=ativos.reduce((a,x)=>a+saldo(x.id)*num(x.custo_unitario),0);
 $("content").innerHTML=`<div class="grid">
 <div class="card"><div class="muted">Itens ativos</div><div class="kpi">${ativos.length}</div></div>
 <div class="card"><div class="muted">Estoque baixo</div><div class="kpi">${baixos.length}</div></div>
 <div class="card"><div class="muted">Movimentações</div><div class="kpi">${S.m.length}</div></div>
 <div class="card"><div class="muted">Valor estimado</div><div class="kpi">${money(valor)}</div></div></div>
 <div class="card"><h2>Itens abaixo do mínimo</h2>${baixos.length?tableItens(baixos):'<p>Nenhum item abaixo do estoque mínimo.</p>'}</div>`;
}
function tableItens(arr,actions=false){
 return `<div class="tablewrap"><table><thead><tr><th>Código</th><th>Descrição</th><th>Categoria</th><th>Un.</th><th>Saldo</th><th>Mín.</th><th>Status</th>${actions?'<th>Ação</th>':''}</tr></thead><tbody>
 ${arr.map(i=>{let st=statusItem(i);return `<tr><td>${esc(i.codigo)}</td><td>${esc(i.descricao)}</td><td>${esc(catName(i.categoria_id))}</td><td>${esc(i.unidade)}</td><td>${qty(saldo(i.id))}</td><td>${qty(i.estoque_minimo)}</td><td><span class="badge ${st[1]}">${st[0]}</span></td>${actions?`<td><button onclick="editItem(${i.id})">Editar</button></td>`:""}</tr>`}).join("")}</tbody></table></div>`;
}
function itens(){
 $("content").innerHTML=`${canEdit()?`<div class="card"><h2>Cadastro de Item</h2><input type="hidden" id="item-id"><div class="formgrid">
 <div><label>Código *</label><input id="item-codigo"></div><div><label>Descrição *</label><input id="item-desc"></div>
 <div><label>Categoria</label><select id="item-cat"><option value="">Selecione</option>${S.c.filter(x=>x.ativo!==false).map(x=>`<option value="${x.id}">${esc(x.nome)}</option>`).join("")}</select></div>
 <div><label>Unidade *</label><input id="item-un" placeholder="UN, KG, M..."></div>
 <div><label>Estoque mínimo</label><input id="item-min" type="number" step=".001"></div><div><label>Estoque máximo</label><input id="item-max" type="number" step=".001"></div>
 <div><label>Localização</label><input id="item-loc"></div>
 <div><label>Fornecedor</label><select id="item-forn"><option value="">Selecione</option>${S.f.filter(x=>x.ativo!==false).map(x=>`<option value="${x.id}">${esc(x.nome)}</option>`).join("")}</select></div>
 <div><label>Custo unitário</label><input id="item-custo" type="number" step=".01"></div>
 <div class="span2"><label>Observações</label><textarea id="item-obs"></textarea></div></div>
 <div class="actions" style="margin-top:12px"><button onclick="saveItem()">Salvar item</button><button class="secondary" onclick="clearItem()">Limpar</button></div><div id="item-msg" class="msg"></div></div>`:""}
 <div class="card"><h2>Itens</h2><input id="item-search" placeholder="Pesquisar código ou descrição..." oninput="filterItems()" style="margin-bottom:10px">${tableItens(S.i,canEdit())}</div>`;
}
function filterItems(){let q=$("item-search").value.toLowerCase();let arr=S.i.filter(i=>(i.codigo+" "+i.descricao).toLowerCase().includes(q));$("content").querySelector(".card:last-child .tablewrap").outerHTML=tableItens(arr,canEdit())}
function editItem(id){let i=S.i.find(x=>Number(x.id)===Number(id));if(!i)return;$("item-id").value=i.id;$("item-codigo").value=i.codigo;$("item-desc").value=i.descricao;$("item-cat").value=i.categoria_id||"";$("item-un").value=i.unidade||"";$("item-min").value=i.estoque_minimo||0;$("item-max").value=i.estoque_maximo||0;$("item-loc").value=i.localizacao||"";$("item-forn").value=i.fornecedor_id||"";$("item-custo").value=i.custo_unitario||0;$("item-obs").value=i.observacoes||"";scrollTo(0,0)}
function clearItem(){["item-id","item-codigo","item-desc","item-un","item-loc","item-obs"].forEach(x=>$(x).value="");["item-min","item-max","item-custo"].forEach(x=>$(x).value="0");$("item-cat").value="";$("item-forn").value=""}
async function saveItem(){
 let id=$("item-id").value,p={codigo:$("item-codigo").value.trim(),descricao:$("item-desc").value.trim(),categoria_id:$("item-cat").value?Number($("item-cat").value):null,unidade:$("item-un").value.trim().toUpperCase(),estoque_minimo:num($("item-min").value),estoque_maximo:num($("item-max").value),localizacao:$("item-loc").value.trim(),fornecedor_id:$("item-forn").value?Number($("item-forn").value):null,custo_unitario:num($("item-custo").value),observacoes:$("item-obs").value.trim(),ativo:true};
 if(!p.codigo||!p.descricao||!p.unidade)return showMsg("item-msg","Preencha código, descrição e unidade.");
 let r=id?await db.from("itens").update(p).eq("id",id):await db.from("itens").insert([p]);if(r.error)return showMsg("item-msg",r.error.message);
 await load();itens();
}
function movForm(tipo){
 if(!canEdit())return $("content").innerHTML=`<div class="card"><h2>Acesso somente para consulta</h2></div>`;
 let entrada=tipo==="entrada",p=tipo;
 $("content").innerHTML=`<div class="card"><h2>${entrada?"Entrada de Material":"Consumo / Saída"}</h2>
 <form id="${p}-form"><div class="formgrid">
 <div class="span2"><label>Item *</label><select id="${p}-item" required onchange="updatePreview('${tipo}')"><option value="">Selecione</option>${S.i.filter(x=>x.ativo!==false).map(i=>`<option value="${i.id}">${esc(i.codigo)} — ${esc(i.descricao)} | saldo ${qty(saldo(i.id))}</option>`).join("")}</select></div>
 <div><label>Quantidade *</label><input id="${p}-qtd" required inputmode="decimal" oninput="updatePreview('${tipo}')"></div>
 <div><label>Data *</label><input id="${p}-data" type="date" value="${today()}" required></div>
 ${entrada?`<div><label>Fornecedor</label><select id="${p}-forn"><option value="">Selecione</option>${S.f.filter(x=>x.ativo!==false).map(x=>`<option value="${x.id}">${esc(x.nome)}</option>`).join("")}</select></div>
 <div><label>Nota Fiscal</label><input id="${p}-nf"></div><div><label>Custo unitário</label><input id="${p}-custo" inputmode="decimal"></div>`:
 `<div><label>Setor *</label><select id="${p}-setor" required onchange="filterCC()"><option value="">Selecione</option>${S.s.filter(x=>x.ativo!==false).map(x=>`<option value="${x.id}">${esc(x.nome)}</option>`).join("")}</select></div>
 <div><label>Centro de Custo</label><select id="${p}-cc"><option value="">Selecione o setor</option></select></div><div><label>Motivo</label><input id="${p}-motivo"></div>`}
 <div class="span2"><label>Observação</label><textarea id="${p}-obs"></textarea></div></div>
 <div id="${p}-preview" class="card" style="margin-top:12px;background:#f8fafc">Selecione o item e informe a quantidade.</div>
 <button type="submit">${entrada?"Registrar entrada":"Registrar saída"}</button><div id="${p}-msg" class="msg"></div></form></div>`;
 $(`${p}-form`).addEventListener("submit",e=>{e.preventDefault();saveMovement(tipo)});
}
function filterCC(){
 let sid=Number($("saida-setor").value),sel=$("saida-cc");sel.innerHTML='<option value="">Selecione</option>'+S.cc.filter(x=>x.ativo!==false&&Number(x.setor_id)===sid).map(x=>`<option value="${x.id}">${esc(x.codigo?x.codigo+" — ":"")}${esc(x.nome)}</option>`).join("");
}
function updatePreview(tipo){
 let id=Number($(tipo+"-item")?.value),q=num($(tipo+"-qtd")?.value),e=$(tipo+"-preview");if(!id){e.textContent="Selecione o item e informe a quantidade.";return}
 let s=saldo(id);e.innerHTML=tipo==="saida"?`Saldo atual: <b>${qty(s)}</b> → Saldo após saída: <b>${qty(s-q)}</b>`:`Saldo atual: <b>${qty(s)}</b> → Saldo após entrada: <b>${qty(s+q)}</b>`;
}
async function saveMovement(tipo){
 let itemEl=$(tipo+"-item"),qEl=$(tipo+"-qtd"),itemId=Number.parseInt(itemEl?.value||"",10),q=num(qEl?.value);
 if(!Number.isInteger(itemId)||itemId<=0)return showMsg(tipo+"-msg","Selecione um item.");
 if(!Number.isFinite(q)||q<=0)return showMsg(tipo+"-msg","Informe uma quantidade maior que zero.");
 let i=S.i.find(x=>Number(x.id)===itemId);if(!i)return showMsg(tipo+"-msg","Item não encontrado.");
 if(tipo==="saida"&&q>saldo(itemId))return showMsg(tipo+"-msg",`Estoque insuficiente. Saldo atual: ${qty(saldo(itemId))} ${i.unidade}.`);
 let p={item_id:itemId,tipo,quantidade:q,data_movimentacao:$(tipo+"-data").value,usuario_id:null,observacao:$(tipo+"-obs").value.trim()};
 if(tipo==="entrada"){p.fornecedor_id=$(tipo+"-forn").value?Number($(tipo+"-forn").value):null;p.nota_fiscal=$(tipo+"-nf").value.trim();p.custo_unitario=num($(tipo+"-custo").value)}
 else{let sid=Number($(tipo+"-setor").value);if(!sid)return showMsg(tipo+"-msg","Selecione o setor.");let setor=S.s.find(x=>Number(x.id)===sid),ccid=Number($(tipo+"-cc").value),cc=S.cc.find(x=>Number(x.id)===ccid);p.setor=setor?.nome||"";p.centro_custo=cc?.nome||"";p.motivo=$(tipo+"-motivo").value.trim()}
 let {error}=await db.from("movimentacoes").insert([p]);if(error)return showMsg(tipo+"-msg",error.message);
 if(tipo==="entrada"&&p.custo_unitario>0)await db.from("itens").update({custo_unitario:p.custo_unitario}).eq("id",itemId);
 await load();movForm(tipo);showMsg(tipo+"-msg",tipo==="entrada"?"Entrada registrada com sucesso.":"Saída registrada com sucesso.",true);
}
function estoque(){$("content").innerHTML=`<div class="card"><h2>Estoque Atual</h2>${tableItens(S.i)}</div>`}
function historico(){
 $("content").innerHTML=`<div class="card"><h2>Histórico de Movimentações</h2><div class="formgrid" style="margin-bottom:12px"><div><label>Tipo</label><select id="hist-tipo" onchange="renderHist()"><option value="">Todos</option><option value="entrada">Entrada</option><option value="saida">Saída</option></select></div><div><label>Pesquisar</label><input id="hist-q" oninput="renderHist()" placeholder="Item, setor, NF..."></div></div><div id="hist-table"></div></div>`;renderHist()
}
function renderHist(){
 let t=$("hist-tipo")?.value||"",q=($("hist-q")?.value||"").toLowerCase(),arr=S.m.filter(m=>(!t||m.tipo===t)&&(`${itemName(m.item_id)} ${m.setor||""} ${m.centro_custo||""} ${m.nota_fiscal||""} ${m.motivo||""}`).toLowerCase().includes(q));
 $("hist-table").innerHTML=`<div class="tablewrap"><table><thead><tr><th>Data</th><th>Tipo</th><th>Item</th><th>Qtd.</th><th>Setor</th><th>Centro de Custo</th><th>NF / Motivo</th></tr></thead><tbody>${arr.map(m=>`<tr><td>${dateBR(m.data_movimentacao)}</td><td><span class="badge ${m.tipo==="entrada"?"ok":"warn"}">${m.tipo.toUpperCase()}</span></td><td>${esc(itemName(m.item_id))}</td><td>${qty(m.quantidade)}</td><td>${esc(m.setor||"")}</td><td>${esc(m.centro_custo||"")}</td><td>${esc(m.nota_fiscal||m.motivo||"")}</td></tr>`).join("")}</tbody></table></div>`;
}
function cadastros(){
 if(!canEdit())return $("content").innerHTML=`<div class="card"><h2>Cadastros</h2><p>Seu perfil possui acesso somente para consulta.</p></div>`;
 $("content").innerHTML=`<div class="tabs"><button onclick="cadTab('categorias')">Categorias</button><button onclick="cadTab('fornecedores')">Fornecedores</button><button onclick="cadTab('setores')">Setores</button><button onclick="cadTab('cc')">Centros de Custo</button></div><div id="cad-body"></div>`;cadTab("categorias")
}
function cadTab(t){
 document.querySelectorAll(".tabs button").forEach(b=>b.classList.remove("active"));event?.target?.classList.add("active");
 if(t==="categorias")$("cad-body").innerHTML=`<div class="card"><h2>Categorias</h2><div class="formgrid"><div><label>Nome</label><input id="cad-cat"></div></div><button style="margin-top:10px" onclick="addSimple('categorias','cad-cat')">Adicionar</button><div id="cad-msg" class="msg"></div></div>${simpleTable(S.c,"categorias")}`;
 if(t==="setores")$("cad-body").innerHTML=`<div class="card"><h2>Setores</h2><div class="formgrid"><div><label>Nome</label><input id="cad-set"></div><div><label>Responsável</label><input id="cad-resp"></div></div><button style="margin-top:10px" onclick="addSetor()">Adicionar</button><div id="cad-msg" class="msg"></div></div>${simpleTable(S.s,"setores",true)}`;
 if(t==="fornecedores")$("cad-body").innerHTML=`<div class="card"><h2>Fornecedores</h2><div class="formgrid"><div><label>Nome *</label><input id="forn-nome"></div><div><label>CNPJ</label><input id="forn-cnpj"></div><div><label>Telefone</label><input id="forn-tel"></div><div><label>E-mail</label><input id="forn-email"></div><div><label>Contato</label><input id="forn-contato"></div></div><button style="margin-top:10px" onclick="addForn()">Adicionar</button><div id="cad-msg" class="msg"></div></div>${simpleTable(S.f,"fornecedores",true)}`;
 if(t==="cc")$("cad-body").innerHTML=`<div class="card"><h2>Centros de Custo</h2><div class="formgrid"><div><label>Código</label><input id="cc-cod"></div><div><label>Nome *</label><input id="cc-nome"></div><div><label>Setor *</label><select id="cc-setor"><option value="">Selecione</option>${S.s.filter(x=>x.ativo!==false).map(x=>`<option value="${x.id}">${esc(x.nome)}</option>`).join("")}</select></div></div><button style="margin-top:10px" onclick="addCC()">Adicionar</button><div id="cad-msg" class="msg"></div></div>
 <div class="card"><div class="tablewrap"><table><thead><tr><th>Código</th><th>Nome</th><th>Setor</th><th>Status</th></tr></thead><tbody>${S.cc.map(x=>`<tr><td>${esc(x.codigo||"")}</td><td>${esc(x.nome)}</td><td>${esc(S.s.find(s=>Number(s.id)===Number(x.setor_id))?.nome||"")}</td><td>${x.ativo!==false?"Ativo":"Inativo"}</td></tr>`).join("")}</tbody></table></div></div>`;
}
function simpleTable(arr,t,extra=false){return `<div class="card"><div class="tablewrap"><table><thead><tr><th>Nome</th>${extra?'<th>Detalhe</th>':''}<th>Status</th></tr></thead><tbody>${arr.map(x=>`<tr><td>${esc(x.nome)}</td>${extra?`<td>${esc(t==="setores"?x.responsavel||"":t==="fornecedores"?x.cnpj||"":"")}</td>`:""}<td>${x.ativo!==false?"Ativo":"Inativo"}</td></tr>`).join("")}</tbody></table></div></div>`}
async function addSimple(tab,id){let nome=$(id).value.trim();if(!nome)return showMsg("cad-msg","Informe o nome.");let {error}=await db.from(tab).insert([{nome,ativo:true}]);if(error)return showMsg("cad-msg",error.message);await load();cadTab(tab==="categorias"?"categorias":"setores")}
async function addSetor(){let nome=$("cad-set").value.trim();if(!nome)return showMsg("cad-msg","Informe o nome.");let {error}=await db.from("setores").insert([{nome,responsavel:$("cad-resp").value.trim(),ativo:true}]);if(error)return showMsg("cad-msg",error.message);await load();cadTab("setores")}
async function addForn(){let nome=$("forn-nome").value.trim();if(!nome)return showMsg("cad-msg","Informe o nome.");let p={nome,cnpj:$("forn-cnpj").value.trim(),telefone:$("forn-tel").value.trim(),email:$("forn-email").value.trim(),contato:$("forn-contato").value.trim(),ativo:true};let {error}=await db.from("fornecedores").insert([p]);if(error)return showMsg("cad-msg",error.message);await load();cadTab("fornecedores")}
async function addCC(){let nome=$("cc-nome").value.trim(),sid=Number($("cc-setor").value);if(!nome||!sid)return showMsg("cad-msg","Informe nome e setor.");let p={codigo:$("cc-cod").value.trim()||null,nome,setor_id:sid,ativo:true};let {error}=await db.from("centros_custo").insert([p]);if(error)return showMsg("cad-msg",error.message);await load();cadTab("cc")}
init();
</script>
